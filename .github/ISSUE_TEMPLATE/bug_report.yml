name: Bug report
description: Something in the app or CLI does not work as documented
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what did you get instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Paste this YouTube link ...
        2. Select these reel types ...
        3. Click "Analyze 10 candidates"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `git rev-parse --short HEAD`, or the release you installed
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `python3 --version`, `ffmpeg -version | head -1`, and your macOS version
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: Paste the error message. Remove any API keys before posting.
      render: shell
