name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # 렌더링 경로 테스트가 실제 ffmpeg/ffprobe 바이너리를 호출한다.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      # 스타일 프리셋이 ~/Library/Fonts에서 Pretendard를 찾는다.
      - name: Install Pretendard
        run: |
          mkdir -p "$HOME/Library/Fonts"
          curl -fsSL -o /tmp/pretendard.zip \
            https://github.com/orioncactus/pretendard/releases/download/v1.3.9/Pretendard-1.3.9.zip
          unzip -o -q /tmp/pretendard.zip -d /tmp/pretendard
          find /tmp/pretendard -name "Pretendard-*.otf" -exec cp {} "$HOME/Library/Fonts/" \;
          ls "$HOME/Library/Fonts/"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

  ui:
    name: Dashboard UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
