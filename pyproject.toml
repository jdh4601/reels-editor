[project]
name = "reels-editor"
version = "0.1.0"
description = "Turn long-form founder interviews on YouTube into vertical short-form reels, on your own machine"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "DongHyun Jung", email = "jdh9490@gmail.com" }]
keywords = ["video", "reels", "shorts", "youtube", "ffmpeg", "llm", "subtitles"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: MacOS X",
  "Intended Audience :: End Users/Desktop",
  "Natural Language :: Korean",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video :: Non-Linear Editor",
]
dependencies = [
  "typer>=0.12",
  "Pillow>=10",
  "PyYAML>=6",
  "rich>=13",
  "fastapi>=0.116",
  "uvicorn>=0.35",
  "websockets>=13",
  "pywebview>=6.0",
  "yt-dlp>=2025.1.15",
  "pyobjc-framework-Vision>=12.2,<13; sys_platform == 'darwin'",
]

[project.urls]
Homepage = "https://github.com/jdh4601/reels-editor"
Repository = "https://github.com/jdh4601/reels-editor"
Issues = "https://github.com/jdh4601/reels-editor/issues"
Changelog = "https://github.com/jdh4601/reels-editor/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28", "pyinstaller>=6.14"]

[project.scripts]
reels-editor = "reels_editor.cli:app"
reels-editor-desktop = "reels_editor.desktop.app:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["reels_editor*"]

[tool.setuptools.package-data]
"reels_editor.desktop" = ["ui/**/*"]
