# D.one 릴스 스타일 (examples/완성된릴스화면*.png에서 추출)
# 게이트에서 바꾼 값은 ~/.config/reels-editor/config.yaml의 style 설정이 우선한다.
canvas: [1080, 1920]
top_bar: 560        # 목표 캡처 기준 상단 블랙바 높이 px
bottom_bar: 570     # 영상 영역 1080x790을 제외한 하단 블랙바 높이 px
font_dir: ~/Library/Fonts
video:
  aspect: [9, 16]       # 원본을 먼저 세로 9:16으로 중앙 크롭
  zoom: 1.0             # 9:16 변환 후 추가 확대 없음
title:
  font: Pretendard-Bold.otf
  size: 105             # 한 줄 제목의 최대 크기. 폭에 맞춰 자동 축소
  y: 1120               # 제목+화자 그룹 중심, 캔버스 y=400px
  color: "#FF7A00"       # 상단 후킹 제목 전체 오렌지
  highlight: "#FF7A00"
  max_lines: 2
  line_gap: 24         # 흰색 첫째 줄과 주황색 둘째 줄 사이에 읽기 쉬운 여백
  speaker_size: 46      # 제목 아래 화자 이름·직함을 더 크게 표시
  speaker_color: "#FFFFFF"
  speaker_gap: 40       # 주황 제목은 고정하고 흰색 화자 정보만 아래로 이동
  anchor_y: 1185        # 화자 정보가 있을 때 주황 제목 중심, 캔버스 y≈368px
  upper_size: 70        # 2줄 제목의 첫 줄은 작은 흰색 전제 문구
  upper_color: "#FFFFFF"
subtitle:
  font: Pretendard-Bold.otf
  size: 40              # 편집기 표기 8 × 5
  opacity: 255          # 100%
  color: "#FFFFFF"
  highlight: "#FFFFFF"   # 자막은 강조색 없이 모두 흰색
  box_alpha: 200         # 검정 박스 불투명도 0-255
  y: -400                # 중앙 원점 편집 좌표(음수=아래), 캔버스 중심 y=1160px
  y_frac: 0.85           # 영상 영역 높이 기준 자막 baseline 위치(0=상단, 1=하단)
watermark:
  text: ""
  image: assets/D.one.png
  width: 212            # 제공된 SVG의 원본 표시 폭 유지
  font: Pretendard-Bold.otf
  size: 75              # 편집기 표기 15 × 5
  opacity: 255          # SVG에 지정된 60% 투명도를 그대로 사용
  y: -1410              # D.one 로고를 20px 위로 이동, 캔버스 y=1665px
  episode_text: "에피소드 1 / 1000"
  episode_size: 48      # 에피소드 문구를 더 크고 선명하게 표시
  episode_color: "#FFFFFF"
  episode_opacity: 255
  episode_gap: 18
  episode_y: -1000      # 에피소드 문구를 조금 아래로 이동, 캔버스 y=1460px
speed: 1.2
